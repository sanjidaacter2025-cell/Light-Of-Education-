<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
      <meta name="viewport"
content="width=device-width,
initial-scale=0.7,
maximum-scale=1.0.,
user-scalable=no">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="wrapper">

    <div class="card" id="otp-card">
        <h2>Verify OTP</h2>
        <p>Enter the 4-digit security code</p>

        <div class="otp-box">
            <input type="text" maxlength="1" class="otp-input">
            <input type="text" maxlength="1" class="otp-input">
            <input type="text" maxlength="1" class="otp-input">
            <input type="text" maxlength="1" class="otp-input">
        </div>

        <button onclick="verifyOtp()">Verify Now</button>
    </div>

    <div class="card success hidden" id="success-card">
        <div class="tick">✓</div>
        <h2>Success!</h2>
        <p>Identity confirmed successfully.</p>
    </div>

</div>

<script>
const inputs = document.querySelectorAll(".otp-input");

inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
        if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
    });
});

function verifyOtp() {
    let otp = "";
    inputs.forEach(i => otp += i.value);

    fetch("/verify", {
        method: "POST",
        headers: {
            "Content-Type":
            "application/x-www-form-urlencoded"
        },
        body: "otp=" + otp
    })
    .then(res => res.json())
    .then(data => {
        if(data.success){
            document.getElementById("otp-card").classList.add("hidden");
            document.getElementById("success-card").classList.remove("hidden");
        } else {
            alert("OTP ভুল");
        }
    });
}
</script>

</body>
</html>
