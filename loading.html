<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=0.6, maximum-scale=0.6, user-scalable=no">

<title>Light Of Education</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#ffffff;
    font-family:Arial,sans-serif;
}

.logo{
    width:220px;
    margin-bottom:20px;
}

/* LIGHT OF EDUCATION */
.loader-text{
    font-size:34px;
    font-weight:700;
    letter-spacing:3px;
    text-align:center;
}

.loader-text span{
    display:inline-block;
    animation:glow 1.5s infinite;
}

/* LIGHT = Orange */
.loader-text span:nth-child(1){animation-delay:0s;color:#ff9900;}
.loader-text span:nth-child(2){animation-delay:.1s;color:#ff9900;}
.loader-text span:nth-child(3){animation-delay:.2s;color:#ff9900;}
.loader-text span:nth-child(4){animation-delay:.3s;color:#ff9900;}
.loader-text span:nth-child(5){animation-delay:.4s;color:#ff9900;}

/* OF = Blue */
.loader-text span:nth-child(7){animation-delay:.5s;color:#0099ff;}
.loader-text span:nth-child(8){animation-delay:.6s;color:#0099ff;}

/* EDUCATION = Green */
.loader-text span:nth-child(10){animation-delay:.7s;color:#22aa22;}
.loader-text span:nth-child(11){animation-delay:.8s;color:#22aa22;}
.loader-text span:nth-child(12){animation-delay:.9s;color:#22aa22;}
.loader-text span:nth-child(13){animation-delay:1s;color:#22aa22;}
.loader-text span:nth-child(14){animation-delay:1.1s;color:#22aa22;}
.loader-text span:nth-child(15){animation-delay:1.2s;color:#22aa22;}
.loader-text span:nth-child(16){animation-delay:1.3s;color:#22aa22;}
.loader-text span:nth-child(17){animation-delay:1.4s;color:#22aa22;}
.loader-text span:nth-child(18){animation-delay:1.5s;color:#22aa22;}

@keyframes glow{
    0%{
        opacity:.2;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-8px);
        text-shadow:0 0 12px currentColor;
    }

    100%{
        opacity:.2;
        transform:translateY(0);
    }
}

/* Loading Bar */

.loader-box{
    width:520px;
    height:18px;
    margin-top:15px;
    border:2px solid #7EDFE0;
    border-radius:20px;
    overflow:hidden;
    background:#ffffff;
}

.loader-fill{
    width:0%;
    height:100%;
    background:#7EDFE0;
    border-radius:20px;
    animation:loading 15s linear forwards;
}

.loading-text{
    width:520px;
    margin-top:6px;
    text-align:left;
    font-size:22px;
    font-weight:bold;
    color:#000;
    letter-spacing:2px;
}

@keyframes loading{
    from{
        width:0%;
    }
    to{
        width:100%;
    }
}

</style>
</head>

<body>

<img src="{{ url_for('static', filename='logo.jpg') }}" class="logo">

<div class="loader-text">
    <span>L</span>
    <span>I</span>
    <span>G</span>
    <span>H</span>
    <span>T</span>

    <span> </span>

    <span>O</span>
    <span>F</span>

    <span> </span>

    <span>E</span>
    <span>D</span>
    <span>U</span>
    <span>C</span>
    <span>A</span>
    <span>T</span>
    <span>I</span>
    <span>O</span>
    <span>N</span>
</div>

<div class="loader-box">
    <div class="loader-fill"></div>
</div>

<div class="loading-text">
    LOADING...
</div>

<script>
setTimeout(function(){
    window.location.href="/login";
},17000);
</script>

</body>
</html>
