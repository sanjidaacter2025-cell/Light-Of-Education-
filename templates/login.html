<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=0.7,
maximum-scale=1.0,
user-scalable=no">

<title>Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="wrapper">

    <div class="card">

        <h2>Login</h2>

        <p>Enter your mobile number</p>
        <p>and password</p>

        <form action="/login" method="POST">

            <input
            type="text"
            name="phone"
            class="field"
            placeholder="01XXXXXXXXX"
            required>

            <input
            type="password"
            name="password"
            class="field"
            placeholder="Password"
            required>

            <button type="submit">
                Login Now
            </button>
            {% if error %}
<p class="error-msg">
    {{ error }}
</p>
{% endif %}

        </form>

        <a href="/register">Register</a>
        <a>or</a>
        <a href="/register">
            Create account
        </a>

    </div>

</div>

</body>
</html>
