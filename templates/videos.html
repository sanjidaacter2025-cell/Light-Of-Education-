<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Library</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

body{
    background:#eef1f4;
    font-family:Arial;
}

.video-card{
    width:70%;
    max-width:350px;
    background:white;
    margin:25px auto;
    padding:20px;
    border-radius:20px;
    border:2px solid #84E1E2;
    box-shadow:0 0 15px rgba(0,0,0,.1);
    text-align:center;
}

.subject{
    font-size:16px;
    margin-bottom:15px;
}

.thumb-box{
    width:260px;
    height:160px;
    margin:15px auto;
    background:#1d1f27;
    border-radius:5px;
    overflow:hidden;
}

.video-thumb{
    width:100%;
    height:100%;
    object-fit:cover;
}

.open-btn{
    background:#84E1E2;
    border:none;
    width:120px;
    height:45px;
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
}

.top-back-btn{
    position:fixed;
    top:90px;
    right:20px;
    background:#84E1E2;
    color:black;
    text-decoration:none;
    padding:12px 25px;
    border-radius:18px;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    z-index:9999;
}

</style>

</head>
<body>

<a href="javascript:history.back()" class="top-back-btn">
    Back
</a>

{% for video in videos %}

<div class="video-card">

    <div class="subject">
        {{ video.title }}
    </div>

    <div class="thumb-box">
        <img class="video-thumb"
             src="{{ url_for('static', filename='images/' + video.thumb) }}">
    </div>

    <button class="open-btn"
    onclick="window.location.href='/video/{{ video.file }}'">
        Open
    </button>

</div>

{% endfor %}

</body>
</html>
